# main project configuration
[project]
site_name = "Eteryu.space"
site_description = "Przewodnik po prywatności, bezpieczeństwie i cyfrowej wolności."
site_author = "Eteryu"
site_url = "https://eteryu.space"
copyright = "Copyright &copy; 2026 Eteryu"

# custom styles
extra_css = ["assets/css/extra.css"]

# custom scripts
extra_javascript = ["assets/js/analytics.js"]

# manual navigation menu
nav = [
    { "Start" = "index.md" },
    { "Baza Wiedzy" = [
        "fundamenty/fundamenty-cyfrowej-higieny.md",
        "fundamenty/modelowanie-zagrozen.md",
        "fundamenty/menedzer-hasel.md",
        "fundamenty/2fa.md",
        "fundamenty/bezpieczny-dns.md",
        "fundamenty/aktualizacje.md",
        { "Prywatność" = [
            "prywatnosc/identyfikator-reklamowy.md",
            "prywatnosc/aliasy.md"
        ]}
    ]},
    { "Poradniki" = [
        { "Zabezpiecz Telefon W 15 Minut" = "poradniki/jak-zabezpieczyc-telefon-w-15-minut.md" },
        { "Prywatny DNS W 5 Minut" = "poradniki/prywatny-dns-w-5-minut.md" },
        { "Darmowy VPN Z Filtrem DNS" = "poradniki/darmowy-vpn-z-filtrowaniem-dns.md" },
        { "Pixel Camera Na GrapheneOS" = "poradniki/jak-zainstalowac-pixel-camera-na-grapheneos.md" },
        { "Storage Scopes" = "poradniki/storage-scopes-grapheneos.md" },
        { "Cyfrowa Higiena" = [
            { "Aliasy E-Mail" = "poradniki/cyfrowa-higiena-aliasy-email.md" },
            { "Bez Podglądaczy" = "poradniki/cyfrowa-higiena-bez-podgladaczy.md" },
            { "Izolacja Aplikacji" = "poradniki/cyfrowa-higiena-izolacja-toksycznych-aplikacji.md" },
            { "Klawiatura I Schowek" = "poradniki/cyfrowa-higiena-klawiatura-keylogger.md" },
            { "Szybkie Zwycięstwa" = "poradniki/cyfrowa-higiena-przerwa-na-kawe.md" }
        ]}
    ]},
    { "Rekomendacje" = [
        "narzedzia/katalog.md",
        "narzedzia/wybor-przegladarki.md",
        "narzedzia/konfiguracja-przegladarek.md",
        "narzedzia/wyszukiwarki.md"
    ]},
    { "Blog" = ["blog/index.md"] },
    { "O Projekcie" = [
        "o-projekcie/prywatnosc.md",
        "o-projekcie/wsparcie.md"
    ]}
]

# theme settings
[project.theme]
variant = "modern"
custom_dir = "overrides"
logo = "assets/img/logo.png"
favicon = "assets/img/favicon.png"
language = "pl"

# ui features
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

# color palette (dark/light mode toggles)
[[project.theme.palette]]
primary = "black"
accent = "pink"
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
primary = "black"
accent = "pink"
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# extra settings
[project.extra]
generator = false

# footer social links
[[project.extra.social]]
icon = "fontawesome/solid/rss"
link = "/feed_rss_created.xml"
name = "Kanał RSS"

[[project.extra.social]]
icon = "fontawesome/brands/mastodon"
link = "https://infosec.exchange/@eteryu"
name = "Mastodon"

[[project.extra.social]]
icon = "fontawesome/solid/link"
link = "https://distrust.pl"
name = "Distrust"

# markdown extensions
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.tilde]

# blog plugin
[project.plugins.blog]
categories = false

# rss plugin
[project.plugins.rss]
match_path = "blog/posts/.*"
date_from_meta.as_creation = "date"
abstract_chars_count = -1
length = 50
